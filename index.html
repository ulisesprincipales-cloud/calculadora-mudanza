<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Mudanza (desde)</title>

  <style>
    :root{
      --bg:#072194;                 /* fondo pedido */
      --card: rgba(255,255,255,.12);
      --text:#ffffff;
      --muted: rgba(255,255,255,.82);
      --border: rgba(255,255,255,.22);
      --shadow: 0 10px 30px rgba(0,0,0,.28);
      --radius: 16px;
      --inputBg: rgba(255,255,255,.14);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
    }
    .container{ max-width:780px; margin:0 auto; display:grid; gap:14px; }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    h1{ margin:0 0 6px; font-size: clamp(20px,3vw,30px); }
    .sub{ margin:0; color: var(--muted); font-size:13px; }

    label{ display:block; margin:12px 0 6px; color: var(--muted); font-size:12px; }
    input[type="number"]{
      width:100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--inputBg);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    .grid{ display:grid; grid-template-columns: repeat(12,1fr); gap:12px; }
    .col-6{ grid-column: span 6; }
    .col-12{ grid-column: span 12; }
    @media (max-width:680px){ .col-6{ grid-column: span 12; } }

    .rangeWrap{ display:flex; align-items:center; gap:10px; }
    input[type="range"]{ width:100%; }
    .value{
      min-width:56px;
      text-align:center;
      padding:6px 10px;
      border-radius: 999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.14);
      font-variant-numeric: tabular-nums;
    }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.14);
      font-size: 13px;
      user-select:none;
    }
    .pill label{ margin:0; color:inherit; font-size:13px; display:inline; }

    .tagRow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .tag{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.14);
      color: var(--muted);
      font-size:12px;
    }

    .resultLabel{ color: var(--muted); font-size:12px; }
    .result{ font-size:32px; font-weight:850; letter-spacing:.2px; margin-top:6px; }
    .mini{ margin-top:8px; color: var(--muted); font-size:12px; line-height:1.35; }

    /* Panel de debug (visible) */
    .debug{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px dashed rgba(255,255,255,.35);
      background: rgba(0,0,0,.12);
      color: rgba(255,255,255,.92);
      font-size:12px;
      white-space: pre-wrap;
    }
    .ok{ color: #a7ffcf; }
    .bad{ color: #ffd27d; }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Calculadora de Mudanza</h1>
      <p class="sub">Estimación orientativa “desde”. Introduce km, plantas y si hay ascensor.</p>
      <div class="tag" id="jsStatus">JS: <span class="bad">NO</span></div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="col-12">
          <label for="km">KM de distancia</label>
          <input id="km" type="number" min="0" step="1" value="10">
        </div>

        <div class="col-6">
          <label>Planta de recogida (1–8+)</label>
          <div class="rangeWrap">
            <input id="pickupFloor" type="range" min="1" max="8" step="1" value="1">
            <div class="value" id="pickupFloorVal">1</div>
          </div>
          <div class="row">
            <span class="pill">
              <input id="pickupElevator" type="checkbox">
              <label for="pickupElevator">Ascensor</label>
            </span>
          </div>
        </div>

        <div class="col-6">
          <label>Planta de entrega (1–8+)</label>
          <div class="rangeWrap">
            <input id="dropoffFloor" type="range" min="1" max="8" step="1" value="1">
            <div class="value" id="dropoffFloorVal">1</div>
          </div>
          <div class="row">
            <span class="pill">
              <input id="dropoffElevator" type="checkbox">
              <label for="dropoffElevator">Ascensor</label>
            </span>
          </div>
        </div>
      </div>

      <div class="tagRow">
        <span class="tag" id="tagKm">Distancia: —</span>
        <span class="tag" id="tagFloors">Plantas: —</span>
      </div>

      <div class="mini">* “8+” se calcula como 8ª planta para esta estimación.</div>
      <div class="debug" id="debugBox">Debug: esperando JS…</div>
    </div>

    <div class="card">
      <div class="resultLabel">Resultado</div>
      <div class="result" id="result">Haz tu mudanza desde: —</div>
      <div class="mini" id="breakdown"></div>
    </div>
  </div>

  <script>
    (function () {
      // Captura errores y los muestra en pantalla
      window.onerror = function (msg, url, line, col) {
        var box = document.getElementById("debugBox");
        if (box) {
          box.textContent = "ERROR JS:\n" +
            String(msg) + "\n" +
            "Línea: " + line + " Col: " + col + "\n" +
            (url ? url : "");
        }
      };

      function setJsOk() {
        var s = document.getElementById("jsStatus");
        if (s) s.innerHTML = 'JS: <span class="ok">OK</span>';
      }

      function euro(n) {
        // Formato simple para evitar problemas con Intl en navegadores raros
        var x = Math.round(n);
        return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " €";
      }

      function floorLabel(v) {
        var n = parseInt(v, 10) || 1;
        return (n >= 8) ? "8+" : String(n);
      }

      function roundToStep(value, step) {
        var s = Math.max(1, parseInt(step, 10) || 1);
        return Math.round(value / s) * s;
      }

      // PRECIOS “DESDE”
      var PRICING = {
        base: 119,
        // €/km por tramos
        tiers: [
          { upTo: 10,  perKm: 1.6 },
          { upTo: 30,  perKm: 1.3 },
          { upTo: 100, perKm: 1.1 },
          { upTo: 1000000000, perKm: 0.95 } // “infinito” sin usar Infinity
        ],
        perFloorWithElevator: 3.5,
        perFloorNoElevator: 9.5,
        roundTo: 5,
        absoluteMin: 99
      };

      function kmCost(km) {
        var remaining = km;
        var lastLimit = 0;
        var cost = 0;
        for (var i = 0; i < PRICING.tiers.length; i++) {
          var limit = PRICING.tiers[i].upTo;
          var perKm = PRICING.tiers[i].perKm;
          var segment = Math.max(0, Math.min(remaining, limit - lastLimit));
          cost += segment * perKm;
          remaining -= segment;
          lastLimit = limit;
          if (remaining <= 0) break;
        }
        return cost;
      }

      function floorCost(floor, hasElevator) {
        var f = Math.min(Math.max(parseInt(floor, 10) || 1, 1), 8);
        var per = hasElevator ? PRICING.perFloorWithElevator : PRICING.perFloorNoElevator;
        return f * per;
      }

      function init() {
        setJsOk();

        var kmInput = document.getElementById("km");
        var pf = document.getElementById("pickupFloor");
        var df = document.getElementById("dropoffFloor");
        var pfVal = document.getElementById("pickupFloorVal");
        var dfVal = document.getElementById("dropoffFloorVal");
        var pe = document.getElementById("pickupElevator");
        var de = document.getElementById("dropoffElevator");
        var resultEl = document.getElementById("result");
        var breakdownEl = document.getElementById("breakdown");
        var tagKm = document.getElementById("tagKm");
        var tagFloors = document.getElementById("tagFloors");
        var debugBox = document.getElementById("debugBox");

        if (!kmInput || !pf || !df || !pfVal || !dfVal || !pe || !de || !resultEl || !breakdownEl || !tagKm || !tagFloors || !debugBox) {
          debugBox.textContent = "Faltan elementos del HTML (IDs). Revisa que copiaste el archivo completo.";
          return;
        }

        function calculate() {
          var km = parseFloat(kmInput.value);
          if (isNaN(km) || km < 0) km = 0;

          // Actualiza etiquetas de plantas SIEMPRE
          pfVal.textContent = floorLabel(pf.value);
          dfVal.textContent = floorLabel(df.value);

          var pickupFloor = parseInt(pf.value, 10) || 1;
          var dropoffFloor = parseInt(df.value, 10) || 1;

          var dist = kmCost(km);
          var floors = floorCost(pickupFloor, pe.checked) + floorCost(dropoffFloor, de.checked);

          var total = PRICING.base + dist + floors;
          if (total < PRICING.absoluteMin) total = PRICING.absoluteMin;
          total = roundToStep(total, PRICING.roundTo);

          tagKm.textContent = "Distancia: " + Math.round(km) + " km";
          tagFloors.textContent =
            "Plantas: recogida " + floorLabel(pickupFloor) + (pe.checked ? " (con)" : " (sin)") + " ascensor · " +
            "entrega " + floorLabel(dropoffFloor) + (de.checked ? " (con)" : " (sin)") + " ascensor";

          resultEl.textContent = "Haz tu mudanza desde: " + euro(total);
          breakdownEl.textContent =
            "Desglose orientativo: base " + euro(PRICING.base) + " · distancia " + euro(dist) + " · plantas " + euro(floors) + ".";

          debugBox.textContent =
            "Debug OK\n" +
            "km=" + km + "\n" +
            "dist=" + dist.toFixed(2) + "\n" +
            "floors=" + floors.toFixed(2) + "\n" +
            "total=" + total;
        }

        // Eventos
        var els = [kmInput, pf, df, pe, de];
        for (var i = 0; i < els.length; i++) {
          els[i].addEventListener("input", calculate);
          els[i].addEventListener("change", calculate);
        }

        // Primera ejecución
        calculate();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
